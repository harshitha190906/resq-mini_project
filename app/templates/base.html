<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ResQNet Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Chart.js CDN for charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Header Section -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <h1>RESQNET — EMERGENCY COMMUNICATION NETWORK</h1>
        <p>ROUTING, ERROR RECOVERY &amp; CONGESTION CONTROL</p>
      </div>
    </div>
    <div class="header-status-bar">
      <div id="globalNotification" class="status-badge" style="display: none;"></div>
      <div class="status-badge">
        <span class="status-dot" style="color: var(--accent-emerald);"></span>
        <span>SYSTEM ONLINE</span>
      </div>
    </div>
  </header>

  <!-- Horizontal Navigation Bar -->
  <nav class="tab-navigation">
    <button class="nav-tab-btn{% if request.endpoint == 'main.dashboard' %} active{% endif %}" data-tab="dashboard" onclick="location.href='{{ url_for('main.dashboard') }}'">
      <span class="fas fa-home"></span> Overview
    </button>
    <button class="nav-tab-btn{% if request.endpoint == 'main.topology' %} active{% endif %}" data-tab="topology" onclick="location.href='{{ url_for('main.topology') }}'">
      <span class="fas fa-network-wired"></span> Network Topology
    </button>
    <button class="nav-tab-btn{% if request.endpoint == 'main.routing' %} active{% endif %}" data-tab="routing" onclick="location.href='{{ url_for('main.routing') }}'">
      <span class="fas fa-route"></span> Routing Simulator
    </button>
    <button class="nav-tab-btn{% if request.endpoint == 'main.reliability' %} active{% endif %}" data-tab="reliability" onclick="location.href='{{ url_for('main.reliability') }}'">
      <span class="fas fa-shield-alt"></span> Error Recovery
    </button>
    <button class="nav-tab-btn{% if request.endpoint == 'main.congestion' %} active{% endif %}" data-tab="congestion" onclick="location.href='{{ url_for('main.congestion') }}'">
      <span class="fas fa-traffic-light"></span> Congestion Control
    </button>
    <button class="nav-tab-btn{% if request.endpoint == 'main.analytics' %} active{% endif %}" data-tab="analytics" onclick="location.href='{{ url_for('main.analytics') }}'">
      <span class="fas fa-chart-line"></span> Performance Analytics
    </button>
    <button class="nav-tab-btn{% if request.endpoint == 'main.history' %} active{% endif %}" data-tab="history" onclick="location.href='{{ url_for('main.history') }}'">
      <span class="fas fa-history"></span> Simulation History
    </button>
  </nav>

  <!-- Main Content Wrapper -->
  <main class="main-wrapper">
    {% block header %}{% endblock %}
    {% block content %}{% endblock %}
  </main>

  <!-- Base Client Scripts -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/topology_vis.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
